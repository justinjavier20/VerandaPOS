!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veranda Resto Garden Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>


<body class="logged-out">

    <main id="customerApp" class="customer-app"></main>

    <div id="loginOverlay">
        <div class="login-stage">
            <div class="login-card">
                <div class="login-logo-wrap">
                    <img class="login-logo" src="295049ea-2cf1-42f9-9b67-5a65c67ebc73-removebg-preview.png" alt="Veranda Resto Garden logo">
                </div>
                <div class="login-brand">Veranda Resto Garden</div>

                <h1>Welcome Back</h1>
                <p class="login-sub">Sign in to continue to the management system.</p>

                <label class="login-label" for="loginUsername">Username</label>
                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="username"
                    onkeydown="if(event.key === 'Enter'){ login(); }"
                >

                <label class="login-label" for="loginPassword">Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    onkeydown="if(event.key === 'Enter'){ login(); }"
                >

                <button class="login-primary" onclick="login()">Login</button>

                <button class="login-link-button" type="button" onclick="showCreateAccountForm()">Create Account</button>

                <div id="loginError" class="login-error" role="alert"></div>

                <div id="createAccountPanel" class="create-account-panel" hidden>
                    <h2 class="create-account-title">Create Account</h2>

                    <label class="login-label" for="createUsername">Create Username</label>
                    <input
                        id="createUsername"
                        type="text"
                        placeholder="Enter a username"
                        autocomplete="username"
                    >

                    <label class="login-label" for="createPassword">Create Password</label>
                    <div class="password-input-wrap">
                        <input
                            id="createPassword"
                            type="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('createPassword')">Show</button>
                    </div>

                    <label class="login-label" for="createPasswordConfirm">Confirm Password</label>
                    <div class="password-input-wrap">
                        <input
                            id="createPasswordConfirm"
                            type="password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('createPasswordConfirm')">Show</button>
                    </div>

                    <div class="create-account-actions">
                        <button class="login-secondary create-account-back" type="button" onclick="hideCreateAccountForm()">Back</button>
                        <button class="login-primary create-account-confirm" type="button" onclick="confirmCreateAccount()">Confirm</button>
                    </div>

                    <div id="createAccountError" class="login-error" role="alert"></div>
                </div>

                <div class="login-divider"><span>or</span></div>

                <button class="login-secondary" type="button" onclick="showCustomerHome()">Back to Customer Page</button>
            </div>
        </div>
    </div>

    <header id="topbar">
        <div class="topbar-brand">
            <img
                class="topbar-brand-logo"
                src="295049ea-2cf1-42f9-9b67-5a65c67ebc73-removebg-preview.png"
                alt=""
            >
            <div class="brand">Veranda Resto Garden</div>
        </div>

        <div class="user">
            <span id="loggedUser"></span>
            <button class="logout" onclick="logout()">Logout</button>
        </div>

        <div id="clock">
            <span id="clockDate"></span>
            <strong id="clockTime"></strong>
        </div>
    </header>

    <div id="statstrip"></div>

    <div id="shell">
        <nav id="rail"></nav>

        <main id="main">
            <div id="content"></div>
        </main>
    </div>

    <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
</body>
</html>
